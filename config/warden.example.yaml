# Canonical example config. Keep in sync with internal/config structs
# (TestLoadExampleConfig fails if it stops loading). Unknown keys are errors.
# Copy to config/warden.dev.yaml for local use.

listen: "127.0.0.1:8443"                  # loopback for dev; use ":8443" (all interfaces) in production
http_redirect_listen: "127.0.0.1:8080"    # optional; plain HTTP, redirects to HTTPS for configured hosts

tls:
  cert_file: deploy/certs/warden.pem
  key_file: deploy/certs/warden-key.pem

auth:
  domain: auth.warden.localhost          # central auth host (login, callback, admin)
  issuer: http://localhost:8180/realms/warden
  client_id: warden-proxy
  client_secret_env: WARDEN_CLIENT_SECRET   # env var NAME; the secret never goes in this file
  scopes: [openid, email, profile]
  id_token_algs: [RS256]                   # pinned ID token algs (Keycloak default); none/HS* are rejected
  groups_claim: groups
  group_refresh_interval: 5m

session:
  redis_addr: localhost:6379
  cookie_name: _warden
  absolute_ttl: 8h
  idle_timeout: 1h

identity:
  header: X-Warden-Identity
  signing_key_file: deploy/certs/identity-signing-key.pem   # ES256 private key
  ttl: 60s                 # max 60s

strip_headers:            # in addition to the built-in list
  - X-Remote-User

audit:
  sink: file              # file | stdout
  file: var/audit.jsonl

# Routes: host is a lowercase DNS name (no port). upstream is scheme://host:port only,
# no path, so the upstream sees exactly the normalized path policy evaluated.
# Every allow rule needs at least one condition; empty rules and lists are errors.
routes:
  - host: whoami.warden.localhost
    upstream: http://127.0.0.1:9001
    policy:
      allow:
        - authenticated: true

  - host: grafana.warden.localhost
    upstream: http://127.0.0.1:9002
    policy:
      allow:
        - groups: [sre, admins]
      paths:
        - prefix: /admin
          allow:
            - groups: [admins]
              require_mfa_within: 10m

  - host: app.warden.localhost
    upstream: https://127.0.0.1:9003      # examples/upstream, mTLS from M4
    upstream_tls:
      ca_file: deploy/certs/internal-ca.pem
      client_cert_file: deploy/certs/warden-client.pem
      client_key_file: deploy/certs/warden-client-key.pem
    policy:
      allow:
        - email_domains: [warden.local]
